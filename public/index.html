
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart Online Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>FreshMart 🛒</h1>

    <nav>
        <button onclick="showPage('home')">Home</button>
        <button onclick="showPage('cart')">Cart (<span id="cartCount">0</span>)</button>
        <button onclick="showPage('orders')">My Orders</button>
        <button id="adminButton" class="hidden"
            onclick="showPage('admin')">Admin</button>
    </nav>

    <div id="account">
        <button onclick="showPage('auth')">Login / Register</button>
    </div>
</header>

<main>

    <!-- HOME PAGE -->
    <section id="home" class="page">

        <div class="banner">
            <h2>Welcome to FreshMart!</h2>
            <p>Fresh vegetables, fruits and fashion products.</p>
        </div>

        <h2>Our Products</h2>

        <select id="category" onchange="displayProducts()">
            <option value="All">All Products</option>
            <option value="Vegetables">Vegetables</option>
            <option value="Fruits">Fruits</option>
            <option value="Women Fashion">Women Fashion</option>
            <option value="Men Fashion">Men Fashion</option>
        </select>

        <div id="products" class="product-container"></div>

    </section>

    <!-- LOGIN AND REGISTER -->
    <section id="auth" class="page hidden">

        <div class="form-box">

            <h2>User Login / Registration</h2>

            <form id="authForm">

                <input id="name" placeholder="Enter your name"
                    class="hidden">

                <input id="email" type="email"
                    placeholder="Enter email" required>

                <input id="password" type="password"
                    placeholder="Enter password (minimum 6 characters)"
                    required>

                <button type="submit" id="authButton">Login</button>

            </form>

            <button onclick="changeMode()">
                Switch Login / Register
            </button>

            <p id="authMessage"></p>

        </div>

    </section>

    <!-- CART -->
    <section id="cart" class="page hidden">

        <h2>Shopping Cart</h2>

        <div id="cartItems"></div>

        <h3 id="total">Total: ₹0</h3>

        <div class="form-box">

            <h3>Checkout</h3>

            <textarea id="address"
                placeholder="Enter delivery address"></textarea>

            <button onclick="checkout()">Place Order</button>

            <p id="checkoutMessage"></p>

        </div>

    </section>

    <!-- ORDER TRACKING -->
    <section id="orders" class="page hidden">

        <h2>My Orders / Order Tracking</h2>

        <div id="orderList"></div>

    </section>

    <!-- ADMIN DASHBOARD -->
    <section id="admin" class="page hidden">

        <h2>Admin Dashboard</h2>

        <div class="form-box">

            <h3>Add New Product</h3>

            <form id="productForm">

                <input id="pname"
                    placeholder="Product name" required>

                <input id="pcategory"
                    placeholder="Category" required>

                <input id="pprice" type="number"
                    min="1" placeholder="Price" required>

                <input id="pimage"
                    placeholder="Product image URL">

                <textarea id="pdescription"
                    placeholder="Description"></textarea>

                <button type="submit">Add Product</button>

            </form>

            <p id="productMessage"></p>

        </div>

        <h3>Manage Products</h3>

        <div id="adminProducts"></div>

        <h3>Manage Orders</h3>

        <div id="adminOrders"></div>

    </section>

</main>

<footer>
    <p>FreshMart E-Commerce Website | MySQL Project</p>
</footer>

<script src="app.js"></script>

</body>
</html>
